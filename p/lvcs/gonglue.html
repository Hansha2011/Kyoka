<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻略</title>
    <style>
        * {
            transition: all .3s ease;
        }

        body {
            margin: 0;
            background: plum;
            -webkit-tap-highlight-color: transparent;
        }

        .logo_place {
            min-height: 100vh;
            min-height: 100dvh;
            width: auto;
            padding: 30px 16px;
            box-sizing: border-box;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            touch-action: manipulation;
        }

        .guide-btn {
            cursor: pointer;
            touch-action: manipulation;
            max-width: 260px;
            margin: 30px auto;
        }

        @media (hover: hover) {
            .guide-btn:hover {
                transform: translateY(-3px);
                filter: brightness(1.1);
            }
        }

        .guide-content {
            display: none;
        }

        .guide-content.show {
            display: block;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .popup-overlay.hidden {
            display: none;
        }

        .popup-box {
            background: #fff;
            border-radius: 12px;
            padding: 36px 28px;
            max-width: 420px;
            width: 85vw;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .popup-text {
            font-size: 20px;
            color: #4a2040;
            line-height: 2;
            margin-bottom: 28px;
        }

        .popup-btn {
            padding: 10px 36px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #b39ddb;
            color: #fff;
            font-family: inherit;
            transition: all .2s ease;
        }

        .popup-btn:hover {
            background: #9575cd;
        }
    </style>

    <script>
        function jumpto(url){
            window.open(url)
        }

        function closeWarning() {
            document.getElementById('warningOverlay').classList.add('hidden');
        }

        function showGuide(id) {
            var content = document.getElementById(id);
            if (content.classList.contains('show')) {
                content.classList.remove('show');
            } else {
                content.classList.add('show');
            }
        }
    </script>
</head>
<body oncontextmenu="return false;">
    <div id="warningOverlay" class="popup-overlay">
        <div class="popup-box">
            <div class="popup-text">
                本攻略可能包含剧透内容，<br>
                以及包含恐怖元素的插图。<br>
                请您确保做好心理准备后，<br>
                再点按下方按钮查看教程。
            </div>
            <button class="popup-btn" onclick="closeWarning()">确 认</button>
        </div>
    </div>
    <center class="logo_place">
        <img
            src="./img/gonglue/4b7e689d093b2757bfe009f76644bfeb.png"
            alt=""
            class="guide-btn"
            draggable="false"
            oncontextmenu="return false;"
            onselectstart="return false;"
            onclick="showGuide('guide1')"
        >
        <div id="guide1" class="guide-content">
            <img
                src="./img/gonglue/nzrgym.png"
                alt=""
                draggable="false"
                oncontextmenu="return false;"
                onselectstart="return false;"
            >
        </div>
        <img
            src="./img/gonglue/16f66edcb13431616b7192b7b1221ebf_720.png"
            alt=""
            class="guide-btn"
            draggable="false"
            oncontextmenu="return false;"
            onselectstart="return false;"
            onclick="showGuide('guide2')"
        >
        <div id="guide2" class="guide-content">
            <img
                src="./img/gonglue/nzrgyy.png"
                alt=""
                draggable="false"
                oncontextmenu="return false;"
                onselectstart="return false;"
            >
        </div>
        <img
            src="./img/gonglue/8f2073690754f1d5df4dc2ba90be8d76_720.png"
            alt=""
            class="guide-btn"
            draggable="false"
            oncontextmenu="return false;"
            onselectstart="return false;"
            onclick="showGuide('guide3')"
        >
        <div id="guide3" class="guide-content">
            <img
                src="./img/gonglue/nnzrgym.png"
                alt=""
                draggable="false"
                oncontextmenu="return false;"
                onselectstart="return false;"
            >
        </div>
        <img
            src="./img/gonglue/f4d06b74c9f03830bda4722d09ff7b12_720.png"
            alt=""
            class="guide-btn"
            draggable="false"
            oncontextmenu="return false;"
            onselectstart="return false;"
            onclick="showGuide('guide4')"
        >
        <div id="guide4" class="guide-content">
            <img
                src="./img/gonglue/nnzrgyy.png"
                alt=""
                draggable="false"
                oncontextmenu="return false;"
                onselectstart="return false;"
            >
        </div>
    </center>
</body>
</html>
